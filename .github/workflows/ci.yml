name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: benchmark smoke (AACMS must beat the baselines)
        run: python -m benchmark.runner --profile api --scenarios steady spike --duration 200 --policies LRU GDSF AACMS
