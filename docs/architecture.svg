<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7a"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#c9d4de;stroke-width:1.5}
      .lbl{font-size:13px;fill:#1c2b36;font-weight:600}
      .sub{font-size:10.5px;fill:#5b6b7a}
      .grp{font-size:11px;fill:#8b98a5;font-weight:700;letter-spacing:.08em}
      .flow{stroke:#5b6b7a;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .note{font-size:10px;fill:#7a8894;font-style:italic}
      .eng{fill:#fff4f3;stroke:#f0a9a2}
      .base{fill:#f3faf4;stroke:#a9d9b2}
      .data{fill:#f2f7fd;stroke:#a8c8ec}
      .l1{fill:#fdeceb;stroke:#f0a9a2}.l2{fill:#eef4fd;stroke:#a8c8ec}.l3{fill:#eef8f0;stroke:#a9d9b2}
    </style>
  </defs>
  <rect width="1200" height="780" fill="#ffffff"/>
  <text x="40" y="34" font-size="19" font-weight="700" fill="#0e1116">CACHE MIND — an AI brain above a multi-level cache</text>
  <text x="40" y="52" class="sub">KASUKABE DEFENCE FORCE · every module imports only common/interfaces.py</text>

  <!-- workload -->
  <text x="40" y="86" class="grp">WORKLOAD/</text>
  <rect rx="9" class="box data" x="40" y="94" width="230" height="78"/>
  <text x="54" y="116" class="lbl">Traffic generator</text>
  <text x="54" y="134" class="sub">api · recsys profiles</text>
  <text x="54" y="150" class="sub">6 scenarios: steady · spike · shift</text>
  <text x="54" y="164" class="sub">diurnal · cold_start · regime_flip</text>

  <!-- driver -->
  <text x="40" y="210" class="grp">BENCHMARK/</text>
  <rect rx="9" class="box" x="40" y="218" width="230" height="104"/>
  <text x="54" y="240" class="lbl">SimDriver</text>
  <text x="54" y="258" class="sub">one clock · one cost model</text>
  <text x="54" y="274" class="sub">per request: L1/L2/L3 hit /</text>
  <text x="54" y="288" class="sub">refresh / origin miss</text>
  <text x="54" y="304" class="sub">per epoch: maintenance + snapshot</text>

  <!-- baselines -->
  <text x="310" y="86" class="grp">BASELINES/</text>
  <rect rx="9" class="box base" x="310" y="94" width="210" height="112"/>
  <text x="324" y="116" class="lbl">LRU · LFU · GDS · GDSF</text>
  <text x="324" y="134" class="sub">single-tier, from scratch</text>
  <text x="324" y="158" class="lbl" font-size="12">LRU-tiered · GDSF-tiered</text>
  <text x="324" y="176" class="sub">same L1/L2/L3 hardware,</text>
  <text x="324" y="190" class="sub">dumb positional placement</text>
  <text x="324" y="203" class="note">the fair comparison</text>

  <!-- engine -->
  <text x="560" y="86" class="grp">ENGINE/ — CACHE MIND</text>
  <rect rx="10" class="box eng" x="560" y="94" width="600" height="300"/>

  <rect rx="8" class="box" x="578" y="112" width="185" height="80"/>
  <text x="590" y="132" class="lbl">predict.py</text>
  <text x="590" y="150" class="sub">p_soon · trend · confidence</text>
  <text x="590" y="165" class="sub">expected_hits(n)</text>
  <text x="590" y="181" class="note">cheap · online · no training</text>

  <rect rx="8" class="box" x="775" y="112" width="185" height="80"/>
  <text x="787" y="132" class="lbl">scoring.py</text>
  <text x="787" y="150" class="sub">value = L + w·GDSF·(1+tilt)</text>
  <text x="787" y="165" class="sub">net_value(o, tier) economics</text>
  <text x="787" y="181" class="note">tilt=0 ⇒ exactly GDSF</text>

  <rect rx="8" class="box" x="972" y="112" width="172" height="80"/>
  <text x="984" y="132" class="lbl">bandit.py</text>
  <text x="984" y="150" class="sub">LinUCB · 6 arms</text>
  <text x="984" y="165" class="sub">weights re-chosen / epoch</text>
  <text x="984" y="181" class="note">the ML part</text>

  <rect rx="8" class="box" x="578" y="204" width="185" height="66"/>
  <text x="590" y="224" class="lbl">autoscaler.py</text>
  <text x="590" y="242" class="sub">ghost-list ROI test</text>
  <text x="590" y="257" class="sub">grow / shrink L1</text>

  <rect rx="8" class="box" x="775" y="204" width="369" height="66"/>
  <text x="787" y="224" class="lbl">cachemind.py — 11-step epoch loop</text>
  <text x="787" y="242" class="sub">observe → predict → score → net-value/tier → promote/evict</text>
  <text x="787" y="257" class="sub">→ prefetch → refresh → compress → scale → learn</text>

  <!-- tiers -->
  <text x="578" y="298" class="grp">MULTI-LEVEL CACHE</text>
  <rect rx="8" class="box l1" x="578" y="306" width="180" height="70"/>
  <text x="590" y="326" class="lbl">L1 · RAM</text>
  <text x="590" y="343" class="sub">~0.5 ms · $0.12/GB-hr</text>
  <text x="590" y="358" class="sub">the working set</text>

  <rect rx="8" class="box l2" x="770" y="306" width="180" height="70"/>
  <text x="782" y="326" class="lbl">L2 · Redis</text>
  <text x="782" y="343" class="sub">~4 ms · $0.03/GB-hr</text>
  <text x="782" y="358" class="sub">demoted + prefetched</text>

  <rect rx="8" class="box l3" x="962" y="306" width="182" height="70"/>
  <text x="974" y="326" class="lbl">L3 · cold store</text>
  <text x="974" y="343" class="sub">~28 ms · $0.004/GB-hr</text>
  <text x="974" y="358" class="sub">long tail worth keeping</text>

  <text x="760" y="392" class="note" text-anchor="middle">miss all tiers → Origin: 120–2000 ms · $0.0005–0.006 to regenerate</text>

  <!-- results / api -->
  <text x="40" y="440" class="grp">RESULTS/  →  API/ + DASHBOARD/</text>
  <rect rx="9" class="box data" x="40" y="448" width="480" height="80"/>
  <text x="54" y="470" class="lbl">EpochSnapshot rows → cachemind.db (SQLite)</text>
  <text x="54" y="488" class="sub">REPORT_*.md · ABLATION · SENSITIVITY · charts</text>
  <text x="54" y="505" class="sub">FastAPI + SSE live sim → React dashboard (tiers · cost · latency · decisions)</text>
  <text x="54" y="520" class="note">baseline policies run in parallel = live counterfactuals</text>

  <!-- results strip -->
  <rect rx="10" class="box eng" x="40" y="556" width="1120" height="180"/>
  <text x="56" y="580" class="lbl">Results — api profile, L1 = 12 % of working set, identical cost model</text>
  <text x="56" y="606" class="sub">                      GDSF (1-tier)   GDSF-tiered (same L1/L2/L3)   CACHE MIND</text>
  <text x="56" y="626" class="sub">  steady      cost $     67.3             39.4                       28.2      (−58 % vs GDSF · −28 % vs tiered)</text>
  <text x="56" y="644" class="sub">  spike       cost $     84.3             42.0                       31.7      (−62 % · −24 %)</text>
  <text x="56" y="662" class="sub">  pop-shift   cost $     76.1             39.8                       30.7      (−60 % · −23 %)</text>
  <text x="56" y="680" class="sub">  regime-flip cost $    159.3             53.5                       46.7      (−71 % · −13 %)</text>
  <text x="56" y="702" class="sub">  p95 latency         23–155 ms         9–22 ms                  6 ms flat</text>
  <text x="56" y="722" class="note">wins: tiering (warm hits vs origin misses) + smart refresh (serve-stale + proactive) + value-aware L1 placement</text>

  <!-- flows -->
  <path class="flow" d="M155 172 L155 218"/>
  <path class="flow" d="M270 250 L310 250 L310 165" marker-start="url(#a)"/>
  <text x="278" y="234" class="note">drives</text>
  <path class="flow" d="M270 270 L560 270" marker-start="url(#a)"/>
  <text x="400" y="262" class="note">drives</text>
  <path class="flow" d="M155 322 L155 448"/>
  <text x="164" y="400" class="note">EpochSnapshot</text>
</svg>
