<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 910" font-family="'IBM Plex Sans',ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8891a3"/></marker>
    <marker id="arrowMiss" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c1483a"/></marker>
    <marker id="arrowReturn" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#ff6b45"/></marker>
    <linearGradient id="l1fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e4ecff"/><stop offset="65%" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="l2fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ebeffa"/><stop offset="65%" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="l3fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eef0f4"/><stop offset="65%" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="enginefill" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffe6dc"/><stop offset="65%" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="originfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e7e9ed"/><stop offset="65%" stop-color="#ffffff"/></linearGradient>
    <style>
      .box{fill:#ffffff;stroke:#d7e0ea;stroke-width:1.4}
      .title{font-size:15.5px;font-weight:700;fill:#12161f}
      .sub{font-size:12.5px;fill:#4c5670}
      .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11.5px;fill:#4c5670}
      .detail{font-size:11px;font-style:italic;fill:#5c6680}
      .grp{font-size:11px;fill:#8b96a5;font-weight:700;letter-spacing:.06em}
    </style>
  </defs>

  <rect width="1400" height="910" fill="#eef3f8"/>

  <!-- header -->
  <text x="40" y="38" font-size="21" font-weight="700" fill="#12161f">CACHE MIND — how a request actually flows</text>
  <text x="40" y="59" class="sub">KASUKABE DEFENCE FORCE — Application → Decision Engine → three storage tiers → Origin/Database</text>
  <g font-size="11.5px" fill="#4c5670">
    <circle cx="900" cy="30" r="5.5" fill="#2f6fed"/><text x="912" y="34">bolder blue = faster</text>
    <rect x="1055" y="24" width="7" height="15" rx="2" fill="#4c5670" opacity=".55"/><text x="1070" y="34">taller box = more storage</text>
  </g>

  <g transform="translate(0,80)">
    <!-- return: origin -> engine, decides placement (drawn first, sits in the clear band above every box) -->
    <path d="M1170,335 C 1010,140 640,50 445,290" fill="none" stroke="#ff6b45" stroke-width="2.4" marker-end="url(#arrowReturn)"/>
    <rect x="586" y="47" width="352" height="20" rx="5" fill="#eef3f8"/>
    <text x="594" y="62" font-family="'IBM Plex Mono',monospace" font-size="11.5" font-weight="600" fill="#8a3517">chooses which tier to place the object in</text>

    <!-- app -> engine -->
    <path d="M232,440 L302,440" fill="none" stroke="#8891a3" stroke-width="2" opacity=".65" marker-end="url(#arrow)"/>
    <!-- engine -> chips stub -->
    <path d="M400,515 L400,530" fill="none" stroke="#8891a3" stroke-width="2" stroke-dasharray="3 4" opacity=".55"/>
    <!-- engine -> tiers fan -->
    <path d="M501,390 L618,207" fill="none" stroke="#8891a3" stroke-width="2" opacity=".65" marker-end="url(#arrow)"/>
    <path d="M501,445 L618,397" fill="none" stroke="#8891a3" stroke-width="2" opacity=".65" marker-end="url(#arrow)"/>
    <path d="M501,500 L618,610" fill="none" stroke="#8891a3" stroke-width="2" opacity=".65" marker-end="url(#arrow)"/>

    <!-- cache miss cascade: L1 -> L2 -> L3 -> Origin -->
    <path d="M900,207 C 962,250 962,340 900,380 C 962,420 962,560 900,600 C 995,630 1090,560 1150,480"
      fill="none" stroke="#c1483a" stroke-width="2.25" stroke-dasharray="6 6" opacity=".9" marker-end="url(#arrowMiss)"/>
    <circle cx="944" cy="290" r="4" fill="#c1483a"/>
    <circle cx="944" cy="500" r="4" fill="#c1483a"/>
    <rect x="905" y="185" width="88" height="18" rx="5" fill="#eef3f8"/>
    <text x="912" y="198" font-family="'IBM Plex Mono',monospace" font-size="11" font-weight="600" fill="#c1483a">cache miss</text>

    <!-- application -->
    <rect class="box" x="40" y="358" width="192" height="140" rx="14"/>
    <text x="58" y="418" class="title">Application</text>
    <text x="58" y="440" class="sub">sends a request for</text>
    <text x="58" y="456" class="sub">an object</text>

    <!-- decision engine -->
    <rect x="300" y="345" width="200" height="150" rx="14" fill="url(#enginefill)" stroke="#f0a988" stroke-width="1.4"/>
    <text x="400" y="412" text-anchor="middle" class="title" fill="#8a3517">Decision Engine</text>
    <text x="400" y="434" text-anchor="middle" class="sub">CACHE MIND — decides</text>
    <text x="400" y="450" text-anchor="middle" class="sub">where things live</text>

    <!-- input chips -->
    <g>
      <rect class="box" x="280" y="530" width="230" height="61" rx="10"/>
      <g transform="translate(294,548) scale(0.79)" fill="none" stroke="#ff6b45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 11a8 8 0 1 0-2.6 6.2M20 5v6h-6"/>
      </g>
      <text x="330" y="565" class="sub" font-weight="600" fill="#12161f">How often is this used?</text>

      <rect class="box" x="280" y="602" width="230" height="61" rx="10"/>
      <g transform="translate(294,620) scale(0.79)" fill="none" stroke="#ff6b45" stroke-width="1.8" stroke-linecap="round">
        <ellipse cx="12" cy="7" rx="7" ry="3"/>
        <path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/>
      </g>
      <text x="330" y="637" class="sub" font-weight="600" fill="#12161f">How expensive to</text>
      <text x="330" y="652" class="sub" font-weight="600" fill="#12161f">regenerate?</text>

      <rect class="box" x="280" y="674" width="230" height="61" rx="10"/>
      <g transform="translate(294,692) scale(0.79)" fill="none" stroke="#ff6b45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 16l6-6 4 4 6-8M20 6h-4M20 6v4"/>
      </g>
      <text x="330" y="705" class="sub" font-weight="600" fill="#12161f">How likely to be needed</text>
      <text x="330" y="720" class="sub" font-weight="600" fill="#12161f">again soon?</text>
    </g>

    <!-- L1 -->
    <rect x="620" y="130" width="260" height="155" rx="14" fill="url(#l1fill)" stroke="#b9caf5" stroke-width="1.4"/>
    <circle cx="638" cy="156" r="5" fill="#2f6fed"/>
    <text x="650" y="161" class="title">L1 · RAM</text>
    <text x="638" y="182" class="sub">Fastest, most expensive, smallest</text>
    <text x="638" y="206" class="mono">~0.5 ms   $$$$   smallest</text>
    <text x="638" y="232" class="detail">Best for: right now — today's homepage,</text>
    <text x="638" y="248" class="detail">whatever's hot this minute.</text>

    <!-- L2 -->
    <rect x="620" y="310" width="260" height="175" rx="14" fill="url(#l2fill)" stroke="#c3d3ec" stroke-width="1.4"/>
    <circle cx="638" cy="336" r="5" fill="#6e8fcc"/>
    <text x="650" y="341" class="title">L2 · Redis-class</text>
    <text x="638" y="362" class="sub">Medium speed, medium cost,</text>
    <text x="638" y="379" class="sub">medium size</text>
    <text x="638" y="403" class="mono">~4 ms   $$   medium</text>
    <text x="638" y="429" class="detail">Best for: recently popular — yesterday's</text>
    <text x="638" y="445" class="detail">top items, might come back.</text>

    <!-- L3 -->
    <rect x="620" y="505" width="260" height="210" rx="14" fill="url(#l3fill)" stroke="#d7e0ea" stroke-width="1.4"/>
    <circle cx="638" cy="531" r="5" fill="#96a1b4"/>
    <text x="650" y="536" class="title">L3 · Cold Storage</text>
    <text x="638" y="557" class="sub">Slowest, cheapest, largest</text>
    <text x="638" y="581" class="mono">~28 ms   $   largest</text>
    <text x="638" y="607" class="detail">Best for: the long tail — old, rarely-viewed,</text>
    <text x="638" y="623" class="detail">kept cheap instead of deleted.</text>

    <!-- origin -->
    <rect x="1165" y="345" width="200" height="150" rx="14" fill="url(#originfill)" stroke="#c7ccd4" stroke-width="1.4"/>
    <text x="1183" y="412" class="title" fill="#414c60">Origin / Database</text>
    <text x="1183" y="434" class="sub">the real source of</text>
    <text x="1183" y="450" class="sub">truth</text>
  </g>

  <!-- footer -->
  <g transform="translate(700,878)">
    <rect x="-460" y="-24" width="920" height="46" rx="23" fill="#ffffff" stroke="#d7e0ea" stroke-width="1.2"/>
    <circle cx="-432" cy="-1" r="5.5" fill="#1f9a5a"/>
    <text x="-412" y="4" font-size="13" font-weight="700" fill="#12161f">Adapts automatically as traffic changes</text>
    <text x="-158" y="4" font-size="12" fill="#4c5670"> — traffic shifts hour to hour; CACHE MIND rebalances the tiers on its own. No manual re-tuning.</text>
  </g>
</svg>
